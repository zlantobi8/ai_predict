<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <div class="login-card">

        <h2>AI Predictive Maintenance</h2>

        <p>Staff Login</p>

        <div id="loginError" class="alert alert-danger d-none py-2" role="alert"></div>

        <form id="loginForm">

            <div class="mb-3">
                <input type="text" class="form-control" id="staffId" name="username"
                       placeholder="Staff ID (e.g. admin)" autocomplete="username" required autofocus>
            </div>

            <div class="mb-3">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary w-100" id="loginButton">Login</button>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
